# Values override file for wso2-agentic-engineer-bundle on an OpenChoreo cluster.
# Pass this with: helm install wso2-agentic-engineer ... -f values/agentic-engineer.yaml
#
# Fill in the values marked with <...> before installing.

# ── Gateway exposure ───────────────────────────────────────────────────────────
# DNS hostnames to expose the platform through the OC gateway.
# Point both at the OC gateway LoadBalancer IP after install.
expose:
  consoleHostname: "asdlc.<your-domain>"
  apiHostname: "asdlc-api.<your-domain>"

# ── Platform services ─────────────────────────────────────────────────────────
wso2-agentic-engineer:
  # Public URLs shown in browser redirects and OIDC callbacks
  console:
    publicURL: "https://asdlc.<your-domain>"
    thunderPublicURL: "https://thunder.<your-domain>"

  # Anthropic API key — required for AI flows
  anthropic:
    apiKey: "<your-anthropic-api-key>"

  # OpenBao token — override "root" for production
  openbao:
    token: "<your-openbao-token>"

  # GitHub App credentials (optional — only needed for App-mode GitHub connect)
  # Leave empty to use PAT-only mode
  github:
    appSlug: ""
    appId: ""
    clientId: ""
    clientSecret: ""
