apiVersion: v1
kind: ServiceAccount
metadata:
  name: asdlc-api
  namespace: {{ .Values.namespace }}
---
# asdlc-api needs to create/manage namespaces and workflow resources
# in the OC workflow plane (e.g. workflows-<orgId> namespaces, Secrets).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: asdlc-api
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["external-secrets.io"]
    resources: ["secretreferences"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: asdlc-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: asdlc-api
subjects:
  - kind: ServiceAccount
    name: asdlc-api
    namespace: {{ .Values.namespace }}
